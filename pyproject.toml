[project]
name = "kvakk-doc-export"
version = "0.1.0"
description = "Export KVAKK documentation from Confluence"
requires-python = ">=3.13"
dependencies = [
    "confluence-markdown-exporter>=5.4,<6",
    "httpx>=0.28,<1",
    "python-dotenv>=1.1,<2",
    "pytest>=8.4,<9",
    "zensical>=0.0.62,<0.1",
]

[project.scripts]
export-confluence = "scripts.export:main"
prepare-docs = "scripts.prepare:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scripts"
module-root = ""
